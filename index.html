<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اربح العطر 🎁</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;

    background:
        radial-gradient(circle at top, #5b101f 0%, #26070e 35%, #090909 100%);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.container {
    width: 95%;
    max-width: 950px;
    text-align: center;
}

h1 {
    font-size: 44px;
    margin: 0 0 10px;
}

.subtitle {
    font-size: 20px;
    margin-bottom: 25px;
    opacity: 0.95;
}

.game {
    position: relative;

    width: 100%;
    height: 430px;

    overflow: hidden;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.02)
        );

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 0 40px rgba(255,255,255,0.03);
}


/* المربع المطلوب التقاط العطر داخله */
.target {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 200px;
    border: 4px dashed white;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: rgba(255,255,255,0.8);
    z-index: 1;
    box-shadow:
        0 0 15px rgba(255,255,255,0.35),
        0 0 45px rgba(255,255,255,0.15);
}

/* صورة العطر */

.perfume {

    position: absolute;

    left: -180px;
    top: 50%;

    width: 140px;
    height: 220px;

    object-fit: contain;

    transform: translateY(-50%);

    z-index: 3;

    filter:
        drop-shadow(0 25px 18px rgba(0,0,0,0.55));

    will-change: left, top;

}


/* التعليمات */

.instruction {

    margin-top: 25px;

    font-size: 19px;

    line-height: 1.8;
}

.highlight {
    color: #ffb4bf;
    font-weight: bold;
}

.hint {

    margin-top: 10px;

    font-size: 15px;

    opacity: 0.65;
}


/* شاشات الموبايل */

@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 17px;
    }

    .game {
        height: 340px;
    }

    .target {
        width: 140px;
        height: 220px;
    }

    .perfume {
        width: 105px;
        height: 170px;
    }

    .instruction {
        font-size: 16px;
    }
}

</style>
</head>


<body>

<div class="container">

    <h1>
        🎁 اربح العطر
    </h1>

    <div class="subtitle">
        التقط Screenshot في اللحظة المناسبة 👀
    </div>


    <div class="game" id="game">

        <div class="target" id="target">
            التقطها هنا!
        </div>

        <img
            src="perfume.png"
            class="perfume"
            id="perfume"
            alt="Perfume"
        >

    </div>


    <div class="instruction">

        📸 خذ
        <span class="highlight">
            Screenshot
        </span>

        عندما تصبح عبوة العطر داخل الإطار تمامًا.

        <br>

        هل تستطيع اصطيادها؟ 😏

    </div>


    <div class="hint">
        ركّز... العطر سريع 😉
    </div>

</div>



<script>

const perfume =
    document.getElementById("perfume");

const game =
    document.getElementById("game");

const target =
    document.getElementById("target");


let x = -180;

let speed = 3.2;

let escaping = false;

let escapeDirection = -1;

let passedTarget = false;



function animatePerfume() {

    const gameRect =
        game.getBoundingClientRect();

    const targetRect =
        target.getBoundingClientRect();

    const perfumeRect =
        perfume.getBoundingClientRect();


    /* تحريك العطر */

    x += speed;

    perfume.style.left =
        x + "px";


    /*
    ===========================
    اكتشاف اقترابه من المربع
    ===========================
    */

    const distanceToTarget =
        targetRect.left -
        perfumeRect.right;


    /*
    قبل أن يدخل المربع
    يهرب فجأة
    */

    if (
        distanceToTarget < 90 &&
        distanceToTarget > -10 &&
        !escaping &&
        !passedTarget
    ) {

        escaping = true;


        /*
        اختيار عشوائي:
        يهرب فوق أو تحت
        */

        escapeDirection =
            Math.random() > 0.5
            ? -1
            : 1;


        perfume.style.transition =
            "top 0.12s ease-out";


        if (escapeDirection === -1) {

            perfume.style.top =
                "12%";

        } else {

            perfume.style.top =
                "88%";

        }

    }



    /*
    بمجرد تجاوزه المربع
    يرجع لمساره الطبيعي
    */

    if (
        perfumeRect.left >
        targetRect.right + 30
    ) {

        passedTarget = true;

        escaping = false;

        perfume.style.transition =
            "top 0.3s ease";

        perfume.style.top =
            "50%";

    }



    /*
    إذا وصل نهاية الشاشة
    يرجع من البداية
    */

    if (
        x >
        gameRect.width + 180
    ) {

        x = -180;

        escaping = false;

        passedTarget = false;

        perfume.style.transition =
            "none";

        perfume.style.top =
            "50%";


        /*
        تغيير السرعة قليلاً
        كل مرة
        */

        speed =
            2.7 +
            Math.random() * 2;

    }


    requestAnimationFrame(
        animatePerfume
    );

}


/*
بدء اللعبة
*/

animatePerfume();

</script>


</body>
</html>
