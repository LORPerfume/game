<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اربح العطر 🎁</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111, #2c0b12);
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .container {
        width: 95%;
        max-width: 900px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 20px;
        margin-bottom: 30px;
    }

    .game {
        position: relative;
        width: 100%;
        height: 400px;
        background: rgba(255,255,255,0.06);
        border: 2px solid rgba(255,255,255,0.15);
        border-radius: 25px;
        overflow: hidden;
    }

    /* مكان الفوز */
    .target {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 260px;
        border: 5px dashed #ffffff;
        border-radius: 20px;
        z-index: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 18px;
        font-weight: bold;
        color: rgba(255,255,255,0.7);

        box-shadow:
            0 0 15px rgba(255,255,255,.5),
            0 0 40px rgba(255,255,255,.2);
    }

    /* صورة العطر */
    .perfume {
        position: absolute;
        width: 140px;
        height: 220px;
        object-fit: contain;

        top: 50%;
        transform: translateY(-50%);

        z-index: 2;

        animation: movePerfume 3.5s linear infinite alternate;

        filter: drop-shadow(0 20px 15px rgba(0,0,0,.5));
    }

    @keyframes movePerfume {

        0% {
            left: -150px;
        }

        100% {
            left: calc(100% - 20px);
        }
    }

    .instruction {
        margin-top: 25px;
        font-size: 19px;
        line-height: 1.8;
    }

    .highlight {
        color: #ffcccb;
        font-weight: bold;
    }

    .hint {
        margin-top: 10px;
        font-size: 15px;
        opacity: .7;
    }

    @media (max-width: 600px) {

        h1 {
            font-size: 30px;
        }

        .game {
            height: 330px;
        }

        .target {
            width: 140px;
            height: 220px;
        }

        .perfume {
            width: 110px;
            height: 180px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🎁 اربح العطر</h1>

    <div class="subtitle">
        هل توقيتك سريع بما فيه الكفاية؟ 👀
    </div>

    <div class="game">

        <div class="target">
            التقطها هنا!
        </div>

        <img
            src="perfume.png"
            class="perfume"
            alt="Perfume"
        >

    </div>

    <div class="instruction">

        📸 خذ <span class="highlight">Screenshot</span>
        عندما تصبح عبوة العطر داخل الإطار تمامًا.

        <br>

        إذا نجحت… أرسل لنا الصورة للدخول بالسحب على العطر 🎁

    </div>

    <div class="hint">
        لا يمكنك إيقاف الحركة 😉
    </div>

</div>

</body>
</html>
